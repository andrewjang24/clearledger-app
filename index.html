<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="A password-protected, manual-entry personal budgeting app.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Clearledger · Personal budget</title>
  <style>
    :root{color-scheme:light;--bg:#f7f8f5;--panel:#fff;--ink:#1d302c;--secondary:#6b7b74;--teal:#15594d;--pale:#e6f1eb;--border:#e3e9e4;--warning:#a34832;--track:#edf1ed;--shadow:0 9px 30px rgba(29,48,44,.04)}
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer;touch-action:manipulation}
    button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #71b3a6;outline-offset:2px}
    .shell{max-width:980px;margin:0 auto;min-height:100vh;padding:28px 26px 104px}
    .mast{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:32px}
    .brand{display:flex;align-items:center;gap:11px;font-weight:760;letter-spacing:-.45px;font-size:19px}
    .brandmark{height:38px;width:38px;border-radius:13px;background:var(--teal);display:grid;place-items:center;color:white;font-size:21px;font-weight:800}
    .authShell{max-width:490px;margin:9vh auto 4vh;padding:0 18px}
    .authCard{background:#fff;border:1px solid var(--border);padding:29px;border-radius:23px;box-shadow:var(--shadow)}
    .authCard h1{font-size:28px;letter-spacing:-1px;line-height:1.15;margin:22px 0 9px}
    .authCard p{color:var(--secondary);font-size:13px;line-height:1.6}
    .authCard .formstack{margin:25px 0 0}
    .authCard .warning{color:#8e5637;background:#fff6ef;border:1px solid #f3ded2;border-radius:12px;padding:11px}
    .authCard .authError{color:#a34832;font-size:13px;font-weight:600;min-height:22px}
    .lockbtn{border:1px solid var(--border);border-radius:10px;background:white;color:var(--teal);padding:6px 10px;font-size:12px;font-weight:650}
    .vaultmeta{display:inline-flex;gap:8px;align-items:center}

    .small{font-size:12px;color:var(--secondary)}
    .tag{display:inline-flex;align-items:center;border:1px solid var(--border);background:#fff;border-radius:99px;padding:5px 10px;font-size:11px;font-weight:650;color:var(--secondary)}
    .intro{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}
    .intro h1{font-weight:740;font-size:clamp(27px,4vw,39px);letter-spacing:-1.4px;line-height:1.17;margin:5px 0 4px}
    .sub{color:var(--secondary);margin:0;max-width:600px}
    .month-nav{display:flex;align-items:center;gap:4px;background:white;border:1px solid var(--border);border-radius:14px;padding:5px;white-space:nowrap}
    .month-nav strong{font-size:13px;min-width:126px;text-align:center}
    .iconbtn{border:0;background:transparent;min-height:32px;min-width:32px;border-radius:9px;color:var(--ink)}
    .iconbtn:hover{background:var(--track)}
    .btn{border:1px solid transparent;background:var(--teal);color:white;font-weight:680;border-radius:12px;padding:11px 16px;min-height:44px;display:inline-flex;align-items:center;gap:8px;justify-content:center;line-height:1.2}
    .btn:hover{filter:brightness(1.04)}
    .btn.secondary{background:var(--panel);color:var(--teal);border-color:var(--border)}
    .btn.ghost{background:var(--pale);color:var(--teal)}
    .btn.danger{background:#fff4ef;color:#a34331;border-color:#f4d9d0}
    .btn.full{width:100%}
    .btn.sm{padding:8px 11px;min-height:34px;font-size:12px}
    .dash-grid{display:grid;grid-template-columns:1.22fr .78fr;gap:16px;margin-bottom:16px}
    .card{border:1px solid var(--border);border-radius:20px;background:var(--panel);padding:22px;box-shadow:var(--shadow)}
    .hero{background:var(--teal);color:white;border-color:var(--teal);overflow:hidden;position:relative;min-height:245px}
    .hero:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.12);border-radius:50%;height:380px;width:380px;right:-215px;top:-140px;box-shadow:0 0 0 50px rgba(255,255,255,.025),0 0 0 100px rgba(255,255,255,.018);pointer-events:none}
    .hero .eyebrow{color:#d0e9de;font-size:12px;font-weight:620;letter-spacing:.4px}
    .hero .big{font-size:clamp(37px,5vw,52px);line-height:1.2;font-weight:740;letter-spacing:-2px;margin:19px 0 8px;font-variant-numeric:tabular-nums}
    .hero .foot{color:#d3e6df;font-size:12px;max-width:345px}
    .hero .hero-actions{display:flex;gap:8px;margin-top:26px;position:relative;z-index:1;flex-wrap:wrap}
    .hero .btn{background:white;color:var(--teal)}
    .hero .btn.outline{background:transparent;color:white;border-color:rgba(255,255,255,.4)}
    .kpis{display:grid;grid-template-columns:1fr;gap:12px}
    .kpi{padding:19px 22px;min-height:115px}
    .kpi .label{font-size:12px;color:var(--secondary);font-weight:600}
    .kpi .figure{font-size:24px;font-weight:740;letter-spacing:-.8px;margin:5px 0 0;font-variant-numeric:tabular-nums}
    .muted{color:var(--secondary)}
    .grid2{display:grid;grid-template-columns:1.06fr .94fr;gap:16px;align-items:start}
    .sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:17px}
    .sectionhead h2{font-size:17px;line-height:1.2;letter-spacing:-.35px;margin:0;font-weight:720}
    .sectionhead .mini{font-size:12px;color:var(--secondary)}
    .budgetrow{padding:0 0 19px;margin:0 0 16px;border-bottom:1px solid var(--border)}
    .budgetrow:last-child{padding-bottom:0;margin-bottom:0;border-bottom:0}
    .budgettop{display:flex;align-items:center;justify-content:space-between;gap:9px}
    .budgetname{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:670}
    .dot{height:10px;width:10px;border-radius:3px;display:inline-block;flex:none}
    .budgetnums{font-size:12px;color:var(--secondary)}
    .track{height:7px;border-radius:99px;background:var(--track);overflow:hidden;margin:11px 0 5px}
    .fill{height:100%;border-radius:99px;transition:width .2s}
    .budgetfine{font-size:11px;color:var(--secondary)}
    .negative{color:var(--warning)!important}
    .list{display:flex;flex-direction:column;gap:0}
    .transrow{display:flex;gap:11px;align-items:center;padding:12px 0;border-top:1px solid var(--border)}
    .transrow:first-child{border-top:0;padding-top:0}
    .txicon{width:38px;height:38px;border-radius:12px;background:var(--pale);display:grid;place-items:center;color:var(--teal);font-size:17px;flex:none}
    .txbody{flex:1;min-width:0}
    .txname{font-weight:670;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .txmeta{font-size:11px;color:var(--secondary)}
    .txamount{text-align:right;font-variant-numeric:tabular-nums;font-weight:720;font-size:13px;white-space:nowrap}
    .txpos{color:var(--teal)}
    .empty{padding:35px 12px;text-align:center;color:var(--secondary);font-size:13px;background:#fafbf9;border-radius:14px}
    .empty .symbol{font-size:31px;margin-bottom:5px}
    .notice{background:#f0f4ef;border:1px solid #dce8de;border-radius:13px;padding:12px 15px;font-size:12px;color:#466156;margin-bottom:17px}
    .notice.warn{background:#fff6ef;border-color:#f3ded2;color:#8e5637}
    .topline{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:17px}
    .tabline{display:flex;gap:5px;padding:5px;background:#eaf0e9;width:max-content;border-radius:12px;margin-bottom:18px}
    .tabline button{border:0;background:transparent;border-radius:9px;color:var(--secondary);font-size:12px;font-weight:650;padding:9px 14px}
    .tabline button.active{background:white;color:var(--teal);box-shadow:0 2px 8px rgba(0,0,0,.05)}
    .planform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .field{display:flex;flex-direction:column;gap:5px;min-width:0}
    .field label{font-size:12px;font-weight:650;color:#42584e}
    .field small{font-size:11px;color:var(--secondary);line-height:1.4}
    input,select,textarea{border:1px solid #dce5df;border-radius:12px;background:white;color:var(--ink);padding:11px 12px;min-height:45px;width:100%;outline:none}
    input:focus,select:focus,textarea:focus{border-color:#4b9283;box-shadow:0 0 0 3px #e2f0eb}
    textarea{resize:vertical;min-height:72px}
    .span2{grid-column:1/-1}
    .sep{border:0;border-top:1px solid var(--border);margin:19px 0}
    .caption{font-size:11px;color:var(--secondary);line-height:1.5}
    .summarymini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}
    .summarymini .card{padding:17px}
    .summarymini strong{font-size:20px;display:block;letter-spacing:-.6px;overflow-wrap:anywhere}
    .summarymini span{font-size:11px;color:var(--secondary)}
    .bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(15px);border-top:1px solid var(--border);z-index:10;padding:7px max(15px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom));}
    .navinner{max-width:670px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
    .navinner button{background:transparent;border:0;border-radius:10px;color:var(--secondary);display:flex;gap:3px;flex-direction:column;align-items:center;min-width:65px;padding:7px 10px;font-size:11px;font-weight:630}
    .navinner button.active{color:var(--teal)}
    .navinner button svg{width:21px;height:21px;stroke-width:1.8}
    .navinner .addbtn{background:var(--teal);color:#fff;width:52px;height:52px;border-radius:17px;display:grid;place-items:center;min-width:0;margin-top:-19px;box-shadow:0 6px 17px rgba(21,89,77,.23)}
    .navinner .addbtn svg{height:24px;width:24px}
    .overlay{position:fixed;inset:0;z-index:30;background:rgba(16,29,24,.43);display:flex;justify-content:center;align-items:flex-end;padding:14px}
    .modal{width:100%;max-width:510px;max-height:min(90vh,850px);overflow:auto;background:white;border-radius:22px;padding:24px;box-shadow:0 15px 70px rgba(0,0,0,.24)}
    .modal h2{font-size:21px;letter-spacing:-.55px;margin:0}
    .modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    .typegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 19px}
    .typegrid button{border:1px solid var(--border);background:#fafbf9;border-radius:12px;min-height:52px;padding:10px;font-size:12px;font-weight:660;color:var(--secondary)}
    .typegrid button.active{border-color:#8fc2b2;background:var(--pale);color:var(--teal)}
    .formstack{display:flex;flex-direction:column;gap:13px}
    .toggle{display:flex;align-items:center;gap:9px;font-size:13px}
    .toggle input{width:18px;height:18px;min-height:0}
    .modalfoot{display:flex;gap:10px;margin-top:20px}
    .modalfoot .btn{flex:1}
    .tinybtn{background:transparent;border:0;color:var(--secondary);font-size:12px;padding:6px}
    .chip{background:var(--pale);font-size:11px;color:var(--teal);font-weight:670;border-radius:99px;padding:4px 8px}
    .smallstack{display:flex;flex-direction:column;gap:10px}
    .owedrow{display:flex;align-items:center;gap:9px;justify-content:space-between;border-top:1px solid var(--border);padding:12px 0}
    .owedrow:first-child{border-top:0}
    .footnote{font-size:11px;color:var(--secondary);padding:20px 3px;line-height:1.6}
    @media(max-width:690px){.shell{padding:22px 16px 100px}.mast{margin-bottom:26px}.dash-grid,.grid2{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:1fr 1fr}.kpi{padding:16px;min-height:105px}.kpi .figure{font-size:20px}.intro{align-items:start;flex-direction:column;gap:12px}.month-nav{align-self:flex-start}.card{padding:19px}.hero{min-height:220px}.summarymini{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.summarymini .card{padding:11px}.summarymini strong{font-size:16px}.modal{padding:18px}.overlay{padding:5px}.planform{grid-template-columns:1fr}.span2{grid-column:1}.brand{font-size:17px}}
    @media(max-width:355px){.kpis{grid-template-columns:1fr}.summarymini{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){.fill{transition:none}}
  </style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
const STORAGE_KEY='clearledger_budget_v1';
const VAULT_KEY='clearledger_encrypted_v2';
const ITERATIONS=600000;
const COLORS={food:'#609586',discretionary:'#8a9cc3',transport:'#c6a56d',other:'#ab8d9d'};
const NAMES={food:'Food & groceries',discretionary:'Discretionary',transport:'Transportation',other:'Other purchases'};
const CAT_KEYS=Object.keys(NAMES);
const TYPES={expense:'Purchase',bill:'Bill payment',income:'Money received',reserve:'Loan reserve transfer',reimbursement:'Reimbursement received'};
const $=id=>document.getElementById(id);
const safe=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>Number.isFinite(Number(v))?Math.max(0,Math.round(Number(v)*100)/100):0;
const cash=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(v)||0);
const dateLocal=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const currentMonth=()=>dateLocal().slice(0,7);
const monthName=m=>{const [y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});};
const monthShift=(m,x)=>{let [y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+x,1);return dateLocal(d).slice(0,7);};
const monthLast=m=>{let [y,mo]=m.split('-').map(Number);return dateLocal(new Date(y,mo,0));};
const defPlan=m=>({opening:null,startDate:m===currentMonth()?dateLocal():m+'-01',bills:0,loan:0,cushion:0,budgets:{food:0,discretionary:0,transport:0,other:0}});
const emptyData=()=>({version:1,plans:{},entries:[]});
function validateData(x){if(!x||x.version!==1||!x.plans||typeof x.plans!=='object'||Array.isArray(x.plans)||!Array.isArray(x.entries)||x.entries.length>20000)throw Error('Invalid or unsupported data.');
 for(const e of x.entries){if(!e||!TYPES[e.type]||!/^(\d{4})-\d\d-\d\d$/.test(e.date)||!Number.isFinite(Number(e.amount))||Number(e.amount)<=0||typeof e.id!=='string'||e.id.length>150||typeof e.note!=='string'||e.note.length>300)throw Error('Invalid transaction in data.');}
 return {version:1,plans:x.plans,entries:x.entries};}
const readOld=()=>{try{const raw=localStorage.getItem(STORAGE_KEY);return raw?validateData(JSON.parse(raw)):null;}catch(e){return null;}};
let data=emptyData(),month=currentMonth(),view='home',modal=null,filter='all',alertMessage='';
let unlocked=false,vaultKey=null,vaultSalt=null,restorePending=null,authError='';
let idleTimer=null,hiddenAt=null;
function scheduleLock(){if(idleTimer)clearTimeout(idleTimer);if(unlocked)idleTimer=setTimeout(()=>{if(unlocked)lockVault();},5*60*1000);}
const id=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'e'+Date.now()+Math.random().toString(36).slice(2);
const te=new TextEncoder(),td=new TextDecoder();
const to64=arr=>{const u=new Uint8Array(arr);let s='';for(let i=0;i<u.length;i+=16384)s+=String.fromCharCode(...u.subarray(i,i+16384));return btoa(s);};
const from64=str=>Uint8Array.from(atob(str),c=>c.charCodeAt(0));
function validateVault(x){if(!x||x.version!==2||x.cipher!=='AES-GCM'||x.kdf!=='PBKDF2-SHA256'||x.iterations!==ITERATIONS||typeof x.salt!=='string'||typeof x.iv!=='string'||typeof x.ciphertext!=='string'||!(/^[A-Za-z0-9+/]+={0,2}$/.test(x.ciphertext))||x.ciphertext.length>4e6||from64(x.salt).length!==16||from64(x.iv).length!==12)throw Error('Invalid or unsupported encrypted backup.');return x;}
const getVault=()=>{try{const v=localStorage.getItem(VAULT_KEY);return v?validateVault(JSON.parse(v)):null;}catch(e){return null;}};
async function keyFrom(password,salt){const k=await crypto.subtle.importKey('raw',te.encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITERATIONS,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function decryptVault(v,password){validateVault(v);const key=await keyFrom(password,from64(v.salt));const arr=await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(v.iv)},key,from64(v.ciphertext));return {key,data:validateData(JSON.parse(td.decode(arr)))};}
async function encryptVault(value,key,salt){const iv=crypto.getRandomValues(new Uint8Array(12));const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(value)));return {version:2,cipher:'AES-GCM',kdf:'PBKDF2-SHA256',iterations:ITERATIONS,salt:to64(salt),iv:to64(iv),ciphertext:to64(cipher)};}
async function save(){if(!unlocked||!vaultKey||!vaultSalt){alert('Unlock Clearledger before saving.');return false;}
 try{const v=await encryptVault(data,vaultKey,vaultSalt);localStorage.setItem(VAULT_KEY,JSON.stringify(v));alertMessage='';return true;}
 catch(e){alertMessage='Saving failed. Your last change may not have been stored. Do not close the app; export a backup if possible.';alert(alertMessage);return false;}}
function lockVault(){if(idleTimer)clearTimeout(idleTimer);unlocked=false;vaultKey=null;vaultSalt=null;data=emptyData();modal=null;restorePending=null;authError='';document.title='Clearledger · Locked';render();}
async function createVault(password,verify){if(password.length<14)throw Error('Choose a password with at least 14 characters.');if(password!==verify)throw Error('The two passwords do not match.');if(!crypto.subtle||!isSecureContext)throw Error('Secure browser connection required.');
 const existing=getVault();if(localStorage.getItem(VAULT_KEY))throw Error('Encrypted data already exists here. Unlock or restore it instead.');
 const salt=crypto.getRandomValues(new Uint8Array(16));const key=await keyFrom(password,salt);const prior=readOld()||emptyData();const ciphertext=await encryptVault(prior,key,salt);
 localStorage.setItem(VAULT_KEY,JSON.stringify(ciphertext));const check=await decryptVault(validateVault(JSON.parse(localStorage.getItem(VAULT_KEY))),password);if(JSON.stringify(check.data)!==JSON.stringify(prior))throw Error('Could not verify encrypted migration.');
 localStorage.removeItem(STORAGE_KEY);data=check.data;vaultKey=key;vaultSalt=salt;unlocked=true;authError='';scheduleLock();render();}
async function unlockVault(password){const v=getVault();if(!v)throw Error('No encrypted vault was found on this device.');const unlockedData=await decryptVault(v,password);data=unlockedData.data;vaultKey=unlockedData.key;vaultSalt=from64(v.salt);unlocked=true;authError='';scheduleLock();render();}
function renderAuth(){let hasVault=Boolean(localStorage.getItem(VAULT_KEY)),hasOld=Boolean(readOld()),invalidVault=hasVault&&!getVault();document.title='Clearledger · '+(hasVault?'Locked':'Set up encryption');
 const title=restorePending?'Restore encrypted backup':invalidVault?'Encrypted data needs recovery':hasVault?'Unlock your budget':'Protect your budget';
 const help=restorePending?'Enter the password used when this backup was created. Restoring replaces the data saved on this device.':invalidVault?'The encrypted storage appears damaged or unsupported. Do not replace it; use a known-good encrypted backup.':hasVault?'Enter your Clearledger password. It is never saved or sent to GitHub.':hasOld?'Your existing Clearledger entries are still on this device. Create a password to encrypt and keep them.':'Create a password before entering any budget information.';
 $('app').innerHTML=`<div class="authShell"><div class="brand"><div class="brandmark">↗</div>Clearledger</div><div class="authCard"><div class="small">LOCAL ENCRYPTED STORAGE</div><h1>${title}</h1><p>${help}</p>
 <form id="authForm" class="formstack"><div class="field"><label for="authPassword">${hasVault||restorePending?'Password':'Create a password (14+ characters)'}</label><input id="authPassword" type="password" autocomplete="${hasVault?'current-password':'new-password'}" required minlength="${hasVault||restorePending?1:14}" autofocus></div>
 ${!hasVault&&!restorePending?'<div class="field"><label for="authConfirm">Confirm password</label><input id="authConfirm" type="password" autocomplete="new-password" required minlength="14"></div>':''}
 <div role="alert" class="authError">${safe(authError)}</div><button class="btn full" type="submit">${restorePending?'Verify and restore':hasVault?'Unlock Clearledger':'Encrypt and continue'}</button></form>
 <div class="smallstack" style="margin-top:15px"><button class="btn secondary full" data-action="recover">Choose encrypted backup (.json)</button>${restorePending?'<button class="btn secondary full" data-action="cancel-restore">Cancel restore</button>':''}
 <input type="file" id="importFile" accept=".json,application/json" style="display:none"></div><p class="warning"><strong>Remember your password.</strong> It cannot be reset by GitHub or ChatGPT. If you forget it, your encrypted budget and backups may be unrecoverable.</p><p class="caption">The website code remains public. This protection does not defend against a compromised device or malicious future changes to the website code. Never enter bank credentials or account numbers.</p></div></div>`;}
function plan(m=month){return data.plans[m]||defPlan(m);}
function planExists(m=month){return Boolean(data.plans[m]&&data.plans[m].opening!==null);}
function entries(m=month){const p=plan(m);return data.entries.filter(x=>x.date.slice(0,7)===m&&(!p.startDate||x.date>=p.startDate));}
function allOwed(){return data.entries.filter(x=>x.type==='expense'&&x.reimbursable&&!data.entries.some(r=>r.type==='reimbursement'&&r.linkId===x.id)).sort((a,b)=>b.date.localeCompare(a.date));}
function monthStats(m=month){const p=plan(m);const ts=entries(m);let incomes=0,purchases=0,billPaid=0,reservePaid=0;let spent={food:0,discretionary:0,transport:0,other:0};
  for(const x of ts){if(x.type==='expense'){purchases+=x.amount;if(spent[x.category]!==undefined)spent[x.category]+=x.amount;}if(x.type==='bill')billPaid+=x.amount;if(x.type==='income'||x.type==='reimbursement')incomes+=x.amount;if(x.type==='reserve')reservePaid+=x.amount;}
  for(const r of data.entries.filter(x=>x.type==='reimbursement'&&x.linkId)){
    const orig=data.entries.find(x=>x.id===r.linkId);
    if(orig&&orig.date.slice(0,7)===m&&orig.date>=p.startDate&&spent[orig.category]!==undefined)spent[orig.category]-=r.amount;
  }
  const opening=p.opening===null?0:p.opening;
  const balance=opening+incomes-purchases-billPaid-reservePaid;
  const unpaid=Math.max(0,n(p.bills)-billPaid);
  const untransferred=Math.max(0,n(p.loan)-reservePaid);
  const available=balance-unpaid-untransferred-n(p.cushion);
  return {p,ts,incomes,purchases,billPaid,reservePaid,spent,balance,unpaid,untransferred,available};
}
function icon(name){const paths={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',activity:'<path d="M3 5h18M3 10h18M3 15h18M3 20h18"/>',settings:'<path d="M3 6h18M6 6v0M3 12h18M15 12v0M3 18h18"/><circle cx="7" cy="6" r="2" fill="white"/><circle cx="16" cy="12" r="2" fill="white"/><circle cx="10" cy="18" r="2" fill="white"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="M8 5l7 7-7 7"/>',back:'<path d="M16 5l-7 7 7 7"/>',check:'<path d="m4 12 5 5L20 6"/>',download:'<path d="M12 3v12m0 0 5-5m-5 5-5-5M4 18v3h16v-3"/>',upload:'<path d="M12 17V4m0 0 5 5m-5-5-5 5M4 18v3h16v-3"/>',close:'<path d="M5 5l14 14M19 5 5 19"/>',trend:'<path d="M3 18l7-7 4 4 7-9M16 6h5v5"/>',wallet:'<rect x="3" y="5" width="18" height="15" rx="3"/><path d="M17 10h4v5h-4a2 2 0 0 1 0-5Z"/>'};return '<svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.85">'+(paths[name]||paths.home)+'</svg>';}
const monthNav=()=>`<div class="month-nav"><button aria-label="Previous month" class="iconbtn" data-action="prev">${icon('back')}</button><strong>${safe(monthName(month))}</strong><button aria-label="Next month" class="iconbtn" data-action="next">${icon('arrow')}</button></div>`;
const numberOrDash=v=>v===null?'Not set':cash(v);
function header(){return `<div class="mast"><div class="brand"><div class="brandmark">↗</div>Clearledger</div><div class="vaultmeta"><span class="tag">ENCRYPTED · LOCAL</span><button class="lockbtn" data-action="lock">Lock</button></div></div><div class="intro"><div><div class="small">PERSONAL BUDGET</div><h1>${view==='activity'?'Transaction history':view==='plan'?'Your spending plan':'Money, made clearer.'}</h1><p class="sub">${view==='home'?'Know what is truly available after bills and money set aside.':view==='activity'?'Every purchase, payment and deposit you have recorded.':'Set remaining allowances and cash commitments for this month.'}</p></div>${monthNav()}</div>`;}
function setupNotice(){return !planExists()?`<div class="notice warn">Start by entering your <strong>checking balance and date</strong> in the Plan tab. Enter the amount of money you have <em>when you begin tracking</em>, not the amount you had at the beginning of the month unless you are recording every transaction since then. <button class="tinybtn" data-action="go-plan"><strong>Set up your plan →</strong></button></div>`:'';}
function home(){const s=monthStats();let d=s.p;let ready=planExists();return `${setupNotice()}
  <div class="dash-grid"><div class="card hero"><div class="eyebrow">AVAILABLE AFTER COMMITMENTS</div><div class="big">${ready?cash(s.available):'—'}</div><div class="foot">Your estimated checking cash, minus unpaid bills, the planned loan transfer and your desired cushion. A negative number means your plan is not funded.</div><div class="hero-actions"><button class="btn" data-action="add">${icon('plus')} Add an entry</button><button class="btn outline" data-action="go-plan">Edit plan</button></div></div>
    <div class="kpis"><div class="card kpi"><div class="label">Estimated checking balance</div><div class="figure">${ready?cash(s.balance):'—'}</div><div class="small">Based on the balance you enter + entries since ${safe(d.startDate)}</div></div><div class="card kpi"><div class="label">Still committed</div><div class="figure">${ready?cash(s.unpaid+s.untransferred+d.cushion):'—'}</div><div class="small">Bills ${cash(s.unpaid)} · loan ${cash(s.untransferred)} · cushion ${cash(d.cushion)}</div></div></div>
  </div>
  <div class="grid2"><section class="card"><div class="sectionhead"><h2>Spending allowances</h2><button class="btn secondary sm" data-action="go-plan">Adjust</button></div>
    ${CAT_KEYS.map(k=>budgetRow(k,s)).join('')}
  </section><section class="card"><div class="sectionhead"><h2>Recent activity</h2><button class="btn secondary sm" data-action="go-activity">View all</button></div>${transactionList(s.ts.slice().sort(txSort).slice(0,5),false)}
  </section></div><div class="footnote">Only transactions you enter are included. “Available” is an estimate, not a live bank balance. A planned student-loan transfer is reserved once, then deducted from checking when you record the actual transfer.</div>`;}
function budgetRow(k,s){let lim=n(s.p.budgets[k]),amt=s.spent[k],left=lim-amt,pct=lim>0?Math.max(0,Math.min(100,amt/lim*100)):0;
return `<div class="budgetrow"><div class="budgettop"><div class="budgetname"><span class="dot" style="background:${COLORS[k]}"></span>${NAMES[k]}</div><div class="budgetnums ${lim>0&&left<0?'negative':''}">${lim>0?cash(left)+' left':'No limit set'}</div></div><div class="track"><div class="fill" style="background:${COLORS[k]};width:${pct}%"></div></div><div class="budgetfine">${cash(amt)} recorded${lim>0?' of '+cash(lim)+' allowed':''}</div></div>`;}
function txSort(a,b){return b.date.localeCompare(a.date)||String(b.created||'').localeCompare(String(a.created||''));}
function shortDate(str){return new Date(str+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function transactionList(ts,editable){if(!ts.length)return `<div class="empty"><div class="symbol">↗</div>No entries yet.<br>Add your first expense, bill or deposit.</div>`;
return `<div class="list">${ts.map(x=>{let positive=x.type==='income'||x.type==='reimbursement';let name=x.note||TYPES[x.type]||'Entry';let kind=x.type==='expense'?NAMES[x.category]||'Purchase':TYPES[x.type]||'Entry';let pending=x.reimbursable&&!data.entries.some(r=>r.linkId===x.id&&r.type==='reimbursement');let paid=x.reimbursable&&!pending;
return `<div class="transrow"><div class="txicon">${positive?'↙':x.type==='reserve'?'⇢':'↗'}</div><div class="txbody"><div class="txname">${safe(name)}</div><div class="txmeta">${safe(shortDate(x.date))} · ${safe(kind)}${pending?' · reimbursement owed':paid?' · reimbursed':''}</div></div><div class="txamount ${positive?'txpos':''}">${positive?'+':'−'}${cash(x.amount)}${editable?`<div><button class="tinybtn" data-action="delete" data-id="${safe(x.id)}">Delete</button></div>`:''}</div></div>`;}).join('')}</div>`;}
function activity(){const s=monthStats();const ts=s.ts.slice().sort(txSort).filter(x=>filter==='all'||x.type===filter);const owed=allOwed();return `${setupNotice()}<div class="summarymini"><div class="card"><span>Money received</span><strong>${cash(s.incomes)}</strong></div><div class="card"><span>Purchases + bills</span><strong>${cash(s.purchases+s.billPaid)}</strong></div><div class="card"><span>Loan transfers</span><strong>${cash(s.reservePaid)}</strong></div></div><div class="grid2"><div class="card"><div class="sectionhead"><h2>Transactions</h2><button data-action="add" class="btn sm">${icon('plus')} Add entry</button></div><div class="field" style="margin-bottom:17px"><label for="filter">Filter</label><select id="filter"><option value="all">All entries</option><option value="expense">Purchases</option><option value="bill">Bill payments</option><option value="income">Money received</option><option value="reserve">Loan transfers</option><option value="reimbursement">Reimbursements received</option></select></div>${transactionList(ts,true)}</div><div class="card"><div class="sectionhead"><h2>Waiting on reimbursement</h2><span class="chip">${owed.length} outstanding</span></div>${owed.length?owed.map(x=>`<div class="owedrow"><div><div style="font-weight:670;font-size:13px">${safe(x.note||'Purchase')}</div><div class="small">${cash(x.amount)} · ${safe(shortDate(x.date))}</div></div><button class="btn secondary sm" data-action="reimburse" data-id="${safe(x.id)}">Mark received</button></div>`).join(''):`<div class="empty">No reimbursements outstanding.</div>`}<p class="caption" style="margin-top:10px">Only mark a reimbursement received after the money has actually arrived. This will add a cash inflow and adjust the original expense's net category total.</p></div></div>`;}
function planView(){let p=plan();return `<div class="notice">You can begin today. For this month, enter your <strong>current checking balance</strong> as the opening balance, today's date as the tracking start, and the <strong>amount still available to spend</strong> in each category. The app will not attempt to reconstruct earlier transactions.</div>
<div class="grid2"><section class="card"><div class="sectionhead"><h2>Cash and commitments</h2></div><form id="planForm" class="planform"><div class="field"><label for="opening">Checking balance at tracking start ($)</label><input type="number" min="0" step="0.01" inputmode="decimal" id="opening" placeholder="Enter your actual balance" value="${p.opening===null?'':p.opening}" required><small>The spendable checking balance, not the total of all bank accounts.</small></div><div class="field"><label for="startDate">Tracking begins</label><input type="date" id="startDate" min="${month}-01" max="${monthLast(month)}" value="${safe(p.startDate)}" required><small>Transactions before this date are not counted for this month's cash.</small></div><div class="field"><label for="bills">Unpaid bills still remaining ($)</label><input type="number" min="0" step="0.01" inputmode="decimal" id="bills" value="${p.bills}"><small>Enter the unpaid total at tracking start; bill-payment entries reduce it.</small></div><div class="field"><label for="loan">Planned Live Oak / loan transfer still to make ($)</label><input type="number" min="0" step="0.01" inputmode="decimal" id="loan" value="${p.loan}"><small>Enter $0 if this month's transfer is already completed.</small></div><div class="field span2"><label for="cushion">Money you want left untouched ($)</label><input type="number" min="0" step="0.01" inputmode="decimal" id="cushion" value="${p.cushion}"><small>Your desired month-end buffer; this is not an expense.</small></div><hr class="sep span2" style="width:100%;margin:4px 0"><div class="span2"><h2 style="font-size:17px;margin:0">Remaining category allowances</h2><p class="caption" style="margin:2px 0 0">Starting today? Enter what you can still spend for the rest of this month, not what you already spent.</p></div>
${CAT_KEYS.map(k=>`<div class="field"><label for="cap_${k}">${NAMES[k]} ($)</label><input type="number" min="0" step="0.01" inputmode="decimal" id="cap_${k}" value="${p.budgets[k]||0}"></div>`).join('')}
<div class="span2"><button class="btn full" type="submit">Save this month's plan</button></div></form></section>
<section class="smallstack"><div class="card"><div class="sectionhead"><h2>How the math works</h2></div><p class="caption">Your available-to-spend estimate is calculated as:</p><div style="font-size:14px;line-height:2.1;font-weight:630">Opening checking balance<br>+ recorded income and reimbursements<br>− recorded purchases and bills<br>− recorded loan transfers<br>− bills not yet paid<br>− loan transfers not yet made<br>− your desired cash cushion</div><p class="caption">Budgets are separate category limits. A low category allowance may constrain you even if the overall available-to-spend figure is positive.</p></div>
<div class="card"><div class="sectionhead"><h2>Your data</h2><span class="chip">Encrypted</span></div><p class="caption">Your entries are encrypted in this browser. No bank connection, cloud sync or shared account. Protect your password and exported backups.</p><div class="smallstack"><button class="btn secondary full" data-action="export">${icon('download')} Export encrypted backup (.json)</button><button class="btn secondary full" data-action="import">${icon('upload')} Restore encrypted backup</button><input type="file" id="importFile" accept=".json,application/json" style="display:none"><button class="btn secondary full" data-action="lock">Lock Clearledger now</button><button class="btn danger full" data-action="clear">Erase this device's budget</button></div><p class="caption" style="margin-top:13px"><strong>Important:</strong> Encrypted browser data can still be erased. Save an encrypted backup after important changes. Do not enter bank credentials, account numbers or routing numbers. Older, unencrypted backups remain unprotected.</p></div></section></div>`;}
function bottomNav(){return `<nav class="bottom" aria-label="Primary navigation"><div class="navinner"><button data-action="go-home" class="${view==='home'?'active':''}">${icon('home')}Home</button><button data-action="go-activity" class="${view==='activity'?'active':''}">${icon('activity')}Activity</button><button class="addbtn" aria-label="Add transaction" data-action="add">${icon('plus')}</button><button data-action="go-plan" class="${view==='plan'?'active':''}">${icon('settings')}Plan</button></div></nav>`;}
function entryModal(){if(!modal)return '';let t=modal.type||'expense';let owed=modal.link?data.entries.find(x=>x.id===modal.link):null;
let date=(month===currentMonth()?dateLocal():month+'-01');let p=plan();if(date<p.startDate)date=p.startDate;
return `<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalhead"><h2 id="modalTitle">${owed?'Receive reimbursement':'Add an entry'}</h2><button class="iconbtn" aria-label="Close" data-action="close">${icon('close')}</button></div>
${!owed?`<div class="typegrid">${['expense','bill','income','reserve'].map(k=>`<button data-action="type" data-type="${k}" class="${t===k?'active':''}" type="button">${safe(TYPES[k])}</button>`).join('')}</div>`:''}
<form id="txForm" class="formstack"><div class="field"><label for="txAmount">Amount ($)</label><input id="txAmount" inputmode="decimal" type="number" min="0.01" step="0.01" required placeholder="0.00" ${owed?'readonly':''} value="${owed?owed.amount:''}"></div>
<div class="field"><label for="txDate">Date money ${owed||t==='income'?'arrived':'moved'}</label><input type="date" id="txDate" min="${month}-01" max="${monthLast(month)}" value="${date}" required></div>
${t==='expense'&&!owed?`<div class="field"><label for="txCategory">Spending category</label><select id="txCategory">${CAT_KEYS.map(k=>`<option value="${k}">${NAMES[k]}</option>`).join('')}</select></div>`:''}
<div class="field"><label for="txNote">${t==='expense'?'What was this for?':'Description'} (optional)</label><input id="txNote" maxlength="90" placeholder="${owed?'Reimbursement':t==='expense'?'Lunch, groceries, etc.':t==='bill'?'Phone bill, utility bill...':t==='reserve'?'Transfer to Live Oak':'Paycheck, deposit...'}" value="${owed?safe('Reimbursement: '+(owed.note||'purchase')):''}"></div>
${t==='expense'&&!owed?`<label class="toggle"><input type="checkbox" id="txReimb"> Someone will reimburse me for this</label>`:''}
<p class="caption">${owed?'Do not mark this received until the money has actually arrived.':t==='reserve'?'Moving money to Live Oak is a transfer, not consumer spending.':t==='bill'?'This lowers both your checking balance and your remaining unpaid-bill commitment.':t==='income'?'Only enter money that has actually been received.':'A reimbursable purchase reduces your cash until the reimbursement arrives.'}</p>
<div class="modalfoot"><button class="btn secondary" type="button" data-action="close">Cancel</button><button class="btn" type="submit">${owed?'Mark received':'Save entry'}</button></div></form></div></div>`;}
function render(){if(!unlocked){renderAuth();return;}document.title='Clearledger · '+monthName(month);$('app').innerHTML='<main class="shell">'+header()+(view==='home'?home():view==='activity'?activity():planView())+(alertMessage?`<div role="alert" class="notice warn">${safe(alertMessage)}</div>`:'')+'</main>'+bottomNav()+entryModal();const filt=$('filter');if(filt)filt.value=filter;}
async function act(action,btn){if(action==='cancel-restore'){restorePending=null;authError='';render();return;}if(!unlocked){if(action==='recover')$('importFile').click();if(action==='cancel-restore'){restorePending=null;authError='';render();}return;}switch(action){case 'lock':lockVault();return;case 'prev':month=monthShift(month,-1);filter='all';break;case 'next':month=monthShift(month,1);filter='all';break;case 'go-home':view='home';break;case 'go-activity':view='activity';break;case 'go-plan':view='plan';break;case 'add':if(!planExists()){view='plan';alertMessage='Set your starting checking balance before recording entries.';}else modal={type:'expense'};break;case 'close':modal=null;break;case 'type':modal={type:btn.dataset.type};break;
case 'delete':{const ent=data.entries.find(x=>x.id===btn.dataset.id);if(ent&&confirm('Delete this entry? Your balances and reports will be recalculated.')){data.entries=data.entries.filter(x=>x.id!==ent.id && !(x.type==='reimbursement'&&x.linkId===ent.id));await save();}break;}
case 'reimburse':{const owed=data.entries.find(x=>x.id===btn.dataset.id);if(owed){month=currentMonth();if(!planExists()){view='plan';alertMessage='Set up the current month before recording the reimbursement.';}else modal={type:'reimbursement',link:owed.id};}break;}
case 'export':exportData();return;case 'import':$('importFile').click();return;case 'clear':if(confirm('Delete ALL Clearledger data from this browser? Export a backup first.')){if(confirm('This cannot be undone without a backup. Delete everything?')){data=emptyData();await save();view='home';}}break;}
render();window.scrollTo({top:0,behavior:'instant'});}
function downloadJson(payload,name){const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function exportData(){if(!unlocked)return;const v=getVault();if(!v){alert('No encrypted data found to back up.');return;}downloadJson({...v,backedUpAt:new Date().toISOString()},'clearledger-encrypted-backup-'+dateLocal()+'.json');}
async function restore(file){if(!file)return;try{if(file.size>4000000)throw Error('Backup is too large.');const x=JSON.parse(await file.text());validateVault(x);restorePending=x;authError='';renderAuth();}catch(err){alert('Could not select backup: '+err.message);}finally{if($('importFile'))$('importFile').value='';}}
async function finishRestore(password){if(!restorePending)throw Error('Choose a backup first.');const v=restorePending;const result=await decryptVault(v,password);if(!confirm('Replace ALL Clearledger data saved on this device with this encrypted backup?'))return;
 localStorage.setItem(VAULT_KEY,JSON.stringify(v));localStorage.removeItem(STORAGE_KEY);data=result.data;vaultKey=result.key;vaultSalt=from64(v.salt);unlocked=true;restorePending=null;scheduleLock();view='home';month=currentMonth();authError='';render();alert('Encrypted backup restored.');}
async function submitPlan(){const p={opening:n($('opening').value),startDate:$('startDate').value,bills:n($('bills').value),loan:n($('loan').value),cushion:n($('cushion').value),budgets:{}};
if(!/^\d{4}-\d\d-\d\d$/.test(p.startDate)||p.startDate.slice(0,7)!==month){alert('Choose a tracking date in the selected month.');return;}
for(const k of CAT_KEYS)p.budgets[k]=n($('cap_'+k).value);
let previous=data.plans[month];if(previous&&previous.startDate!==p.startDate&&data.entries.some(x=>x.date.slice(0,7)===month)){if(!confirm('Changing the tracking start date can change which transactions are counted. Continue?'))return;}
data.plans[month]=p;if(!await save())return;view='home';render();window.scrollTo({top:0,behavior:'instant'});}
async function submitTx(){let amount=Number($('txAmount').value),date=$('txDate').value;const p=plan(month);if(!Number.isFinite(amount)||amount<=0||amount>1e10){alert('Enter a valid, positive amount.');return;}if(!/^\d{4}-\d\d-\d\d$/.test(date)||date.slice(0,7)!==month||date<p.startDate){alert('The entry date must be within this month and on or after your tracking start date.');return;}
let t=modal.link?'reimbursement':modal.type;let note=$('txNote').value.trim().slice(0,90);let x={id:id(),type:t,amount:n(amount),date,note,created:new Date().toISOString()};if(t==='expense'){x.category=$('txCategory').value;x.reimbursable=$('txReimb').checked;}if(modal.link){if(!allOwed().some(x=>x.id===modal.link)){alert('This reimbursement is already recorded.');return;}x.linkId=modal.link;}
data.entries.push(x);if(!await save())return;modal=null;view='home';render();}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el){e.preventDefault();act(el.dataset.action,el).catch(err=>{alert(err.message);});return;}if(e.target.id==='overlay'&&unlocked){modal=null;render();}});
document.addEventListener('submit',async e=>{e.preventDefault();try{if(e.target.id==='authForm'){
 const password=$('authPassword').value;const confirmField=$('authConfirm');
 if(restorePending)await finishRestore(password);else if(getVault())await unlockVault(password);else await createVault(password,confirmField.value);
 }else if(e.target.id==='planForm')await submitPlan();else if(e.target.id==='txForm')await submitTx();
 }catch(err){authError=restorePending?'Incorrect password or invalid backup.':getVault()?'Could not unlock. Check your password.':err.message;if(restorePending)renderAuth();else render();}});
document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;render();}if(e.target.id==='importFile')restore(e.target.files[0]);});
window.addEventListener('pagehide',()=>{if(unlocked)lockVault();});
document.addEventListener('pointerdown',scheduleLock);document.addEventListener('keydown',scheduleLock);
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else {if(hiddenAt&&Date.now()-hiddenAt>5*60*1000&&unlocked)lockVault();else scheduleLock();hiddenAt=null;}});
if(!crypto||!crypto.subtle||!isSecureContext){authError='This app requires HTTPS and a modern Safari browser for encryption.';}
render();
})();
</script>
